# Netlify configuration for lisahaven.co

[build]
  # This script reads your _posts/ markdown files and generates posts-index.json
  command = "node build.js"
  publish = "."

# Netlify Identity - enables the CMS login system
[template.environment]
  NETLIFY_IDENTITY_ENABLED = "true"

# Allow the admin panel to work on any URL path
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# Cache images for performance
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Pinterest pin images (allowed to load from other sites so they can be pinned)
[[headers]]
  for = "/images/pins/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# Cache CSS/JS for performance
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Clean URLs for standalone pages
[[redirects]]
  from = "/start-here"
  to = "/start-here.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/press-kit"
  to = "/press-kit.html"
  status = 200

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.html"
  status = 200

# Old post links (/post?slug=...) move permanently to each post's own page
[[redirects]]
  from = "/post"
  to = "/blog/:slug/"
  status = 301
  force = true
  query = {slug = ":slug"}

[[redirects]]
  from = "/post"
  to = "/post.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/#latest"
  status = 302

# Working files for publishing posts stay private (not part of the website)
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/templates/*"
  to = "/404"
  status = 404
  force = true

# Comment system code stays private (not part of the website)
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true
