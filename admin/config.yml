backend:
  name: git-gateway
  branch: main

# Where uploaded images get stored in your GitHub repo
media_folder: "images/uploads"
public_folder: "/images/uploads"

# The visual editor preview URL
site_url: https://lisahaven.co

collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "Your blog post headline" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Building With AI"
          - "Founder Life"
          - "Business Tips"
          - "Mindset & Growth"
          - "Beauty & Fashion"
          - "Travel"
          - "Discipline"
      - { label: "Emoji", name: "emoji", widget: "string", default: "✨", hint: "One emoji that represents this post" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Read Time", name: "readTime", widget: "string", default: "3 min read" }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "Short teaser shown on the homepage (1-2 sentences)" }
      - { label: "Cover Image", name: "image", widget: "image", required: false, hint: "Optional photo for the post" }
      - { label: "Body", name: "body", widget: "markdown" }
