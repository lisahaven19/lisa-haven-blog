backend:
  name: git-gateway
  branch: main

# Where uploaded images get stored in your GitHub repo
media_folder: "images/uploads"
public_folder: "/images/uploads"

# The visual editor preview URL
site_url: https://lisahaven.co

collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "Your blog post headline" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "The Journey"
          - "Founder Life"
          - "Motherhood"
          - "Mindset & Growth"
          - "Beauty & Style"
          - "Business Tips"
          - "AI & Tech"
          - "Travel"
          - "Carnivore & Wellness"
      - { label: "Emoji", name: "emoji", widget: "string", default: "✨", hint: "One emoji that represents this post" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Last Updated", name: "updated", widget: "datetime", required: false, hint: "Optional. Set this when you refresh an old post, so Google sees it is fresh." }
      - { label: "Read Time", name: "readTime", widget: "string", default: "3 min read" }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "Short teaser shown on the homepage (1-2 sentences)" }
      - { label: "SEO Title", name: "seoTitle", widget: "string", required: false, hint: "Optional. The title Google shows, up to 60 characters, search phrase first." }
      - { label: "Meta Description", name: "metaDescription", widget: "text", required: false, hint: "Optional. The summary Google shows, 150 to 160 characters, with the search phrase." }
      - { label: "Cover Image", name: "image", widget: "image", required: false, hint: "Optional. Leave this empty for a post with only the title and text." }
      - label: "Photo Gallery"
        name: "gallery"
        widget: "list"
        required: false
        summary: "{{fields.image}}"
        hint: "Optional. Add as many photos as you like. They show as a grid of squares, and each one opens big when tapped. To choose where the grid goes, type [gallery] on its own line in the Body. If you skip that, the grid shows at the end of the post."
        field: { label: "Photo", name: "image", widget: "image" }
      - { label: "Hide this post", name: "draft", widget: "boolean", default: false, required: false, hint: "Turn this on to keep the post off the website." }
      - { label: "Body", name: "body", widget: "markdown" }
